name: CI

on:
  push:
    branches: [main, windows]
  pull_request:
  workflow_dispatch:  # run it by hand (gh workflow run CI --ref <branch>), e.g. when GitHub missed a push

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Qt's system libraries (for the QML check, offscreen)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libpulse0 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2t64
      - run: pip install "PySide6-Essentials>=6.6" "PySide6-Addons>=6.6" requests pyyaml pytest ruff
      - run: ruff check cornerplay tests
      - run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Installer builds
        run: ./make-installer.sh

  windows:
    # The Windows version: the tests, the window itself (sample games), then Cornerplay.exe and
    # its installer, started once each. The installer is kept as a build artifact.
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"  # as Cornerplay.exe runs (its spec turns UTF-8 mode on)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "PySide6-Essentials>=6.6" "PySide6-Addons>=6.6" "PySide6-WebEngine" requests pyyaml pytest
      - name: QML compiles
        run: python -m cornerplay --check
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Windows tests
        run: pytest -q tests/test_windows.py tests/test_xbox.py
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Every test (Linux-specific ones may fail here; shown, not blocking)
        continue-on-error: true
        run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: The window opens (from source)
        run: python -m cornerplay --smoke-test
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build Cornerplay.exe and the installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          ./packaging/windows/build.ps1
      - name: Cornerplay.exe opens, and starts its helpers
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath dist\Cornerplay\Cornerplay.exe -ArgumentList "--smoke-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Cornerplay.exe --smoke-test exited $($p.ExitCode)" }
          $marker = Join-Path $env:RUNNER_TEMP "helper-ran.txt"
          $env:PYTHONUTF8 = $null  # the exe must be in UTF-8 mode by itself
          $code = "import sys; from cornerplay import osinfo; open(r'$marker', 'w').write(str(osinfo.WINDOWS) + str(sys.flags.utf8_mode))"
          $h = Start-Process -FilePath dist\Cornerplay\Cornerplay.exe -ArgumentList "--run-code", "`"$code`"" -Wait -PassThru
          if ($h.ExitCode -ne 0 -or (Get-Content $marker) -ne "True1") { throw "the frozen helper did not run in UTF-8 mode: $(Get-Content $marker)" }
          if (-not (Test-Path dist\Cornerplay\backends\legendary.exe)) { throw "legendary.exe missing" }
          if (-not (Test-Path dist\Cornerplay\_internal\SDL2.dll) -and -not (Test-Path dist\Cornerplay\SDL2.dll)) { throw "SDL2.dll missing" }
      - name: The installer installs, the installed copy opens, and it uninstalls
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $setup = Get-ChildItem dist\cornerplay-*-windows-setup.exe | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "Cornerplay-installed"
          # Wait for the installer alone: -Wait would also wait for the Cornerplay it opens at the end.
          $i = Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$dir`"" -PassThru
          if (-not $i.WaitForExit(300000)) { throw "the installer did not finish in 5 minutes" }
          if ($i.ExitCode -ne 0) { throw "the installer exited $($i.ExitCode)" }
          Start-Sleep -Seconds 3
          # A plain silent install (winget, scripts) must leave Cornerplay closed: only Cornerplay's own
          # updater asks the installer to open it again (/relaunch=yes).
          if (Get-Process -Name Cornerplay -ErrorAction SilentlyContinue) { throw "a silent install opened Cornerplay" }
          if (-not (Test-Path "$dir\Cornerplay.exe")) { throw "Cornerplay.exe was not installed" }
          if (-not (Test-Path "$dir\backends\gogdl.exe")) { throw "the backends were not installed" }
          $web = Get-ChildItem -Recurse -Path $dir -Filter QtWebEngineProcess.exe | Select-Object -First 1
          if (-not $web) { throw "QtWebEngineProcess.exe missing: the sign-in window would not open" }
          $p = Start-Process -FilePath "$dir\Cornerplay.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the installed Cornerplay.exe --smoke-test exited $($p.ExitCode)" }
          $u = Start-Process -FilePath "$dir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -PassThru
          if (-not $u.WaitForExit(300000)) { throw "the uninstaller did not finish" }
          Start-Sleep -Seconds 8  # it hands the removal to a copy of itself in %TEMP%
          if (Test-Path "$dir\Cornerplay.exe") { throw "the uninstaller left Cornerplay.exe behind" }
          # Cornerplay's own updater: /relaunch=yes opens the new version when the install is done.
          $dir2 = Join-Path $env:RUNNER_TEMP "Cornerplay-update"
          $i = Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/relaunch=yes", "/DIR=`"$dir2`"" -PassThru
          if (-not $i.WaitForExit(300000)) { throw "the update install did not finish" }
          Start-Sleep -Seconds 5
          if (-not (Get-Process -Name Cornerplay -ErrorAction SilentlyContinue)) { throw "/relaunch=yes did not open Cornerplay" }
          Stop-Process -Name Cornerplay -Force
          $u = Start-Process -FilePath "$dir2\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -PassThru
          if (-not $u.WaitForExit(300000)) { throw "the second uninstall did not finish" }
      - uses: actions/upload-artifact@v4
        with:
          name: cornerplay-windows
          path: dist/cornerplay-*-windows-setup.exe

  winget:
    # The winget manifests of the newest version in packaging/winget: `winget validate`, then a real
    # `winget install --manifest` and uninstall (what microsoft/winget-pkgs asks before a PR).
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      SMARTSCREEN_OFF: ${{ vars.WINGET_SMARTSCREEN_OFF }}
      ZONECHECK_OFF: ${{ vars.WINGET_ZONECHECK_OFF }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate, install and uninstall with winget
        shell: pwsh
        run: |
          $dir = Get-ChildItem packaging\winget\manifests\r\raulgbh-ctrl\Cornerplay -Directory |
                 Sort-Object { [version]$_.Name } | Select-Object -Last 1
          Write-Host "Manifests: $($dir.FullName)"
          winget --version
          winget settings --enable LocalManifestFiles
          # Experiment: SmartScreen off (an unsigned installer downloaded from the internet waits for
          # a "Windows protected your PC" click that no one can give on a runner).
          if ($env:SMARTSCREEN_OFF -eq "1") {
            New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\System" -Force | Out-Null
            Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\System" -Name EnableSmartScreen -Value 0 -Type DWord
            Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer" -Name SmartScreenEnabled -Value "Off"
            Write-Host "SmartScreen switched off for this run"
          }
          # The installer is not code-signed: Windows asks "the
          # publisher could not be verified, run it?" before it runs, and on a runner no one can say yes,
          # so winget waits forever. WINGET_ZONECHECK_OFF=1 says yes for the test; drop it once signed.
          if ($env:ZONECHECK_OFF -eq "1") {
            $k = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Policies\Associations"
            New-Item -Path $k -Force | Out-Null
            Set-ItemProperty -Path $k -Name LowRiskFileTypes -Value ".exe;"
            Write-Host "Open File security warning switched off for .exe"
          }
          # "succeeded with warnings" exits non-zero: the runner's winget can be older than the
          # schema winget-pkgs uses (1.28) and warns about the header link. Only a failure counts.
          $out = winget validate --manifest $dir.FullName | Out-String
          Write-Host $out
          if ($out -notmatch "Manifest validation succeeded") { throw "winget validate failed" }
          # winget may never come back: run it with a time limit, and show what it and the installer did.
          $w = Start-Process -FilePath winget -PassThru -NoNewWindow -ArgumentList @("install", "--manifest", $dir.FullName,
                 "--accept-package-agreements", "--accept-source-agreements", "--disable-interactivity", "--silent", "--verbose-logs")
          $finished = $w.WaitForExit(480000)
          if (-not $finished) {
            Write-Host "== winget still running after 8 minutes. Processes:"
            Get-CimInstance Win32_Process | Where-Object { $_.Name -match "winget|setup|Cornerplay|\.tmp|AppInstaller" } |
              ForEach-Object { Write-Host "$($_.ProcessId) parent $($_.ParentProcessId) $($_.Name) $($_.CommandLine)" }
          }
          $diag = Join-Path $env:LOCALAPPDATA "Packages\Microsoft.DesktopAppInstaller_8wekyb3d8bbwe\LocalState\DiagOutputDir"
          Get-ChildItem $diag -Filter *.log -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 1 |
            ForEach-Object { Write-Host "== winget log $($_.Name)"; Get-Content $_.FullName -Tail 60 }
          Get-ChildItem $diag -Filter "WinGet-raulgbh-ctrl*" -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "== installer log $($_.Name)"; Get-Content $_.FullName -Tail 25 }
          $installed = Test-Path (Join-Path $env:LOCALAPPDATA "Programs\Cornerplay\Cornerplay.exe")
          Write-Host "== Cornerplay.exe installed: $installed"
          if (-not $finished) {
            Stop-Process -Id $w.Id -Force
            # Control: an unrelated Inno Setup package from the winget source, the same way. When it
            # hangs too, this is winget on the runner, not Cornerplay's package.
            $c = Start-Process -FilePath winget -PassThru -NoNewWindow -ArgumentList @("install", "--id", "Notepad++.Notepad++",
                   "--exact", "--accept-package-agreements", "--accept-source-agreements", "--disable-interactivity", "--silent")
            if ($c.WaitForExit(300000)) { Write-Host "== control (Notepad++) finished: exit $($c.ExitCode)" }
            else { Write-Host "== control (Notepad++) hangs too: winget on this runner"; Stop-Process -Id $c.Id -Force }
            throw "winget install did not finish (Cornerplay installed: $installed)"
          }
          if ($w.ExitCode -ne 0) { throw "winget install failed ($($w.ExitCode))" }
          Stop-Process -Name Cornerplay -ErrorAction SilentlyContinue
          $exe = Join-Path $env:LOCALAPPDATA "Programs\Cornerplay\Cornerplay.exe"
          if (-not (Test-Path $exe)) { throw "Cornerplay.exe was not installed at $exe" }
          winget list --id raulgbh-ctrl.Cornerplay --disable-interactivity --accept-source-agreements
          winget uninstall --product-code "{6C1E0E7A-3B5B-4C55-9F0E-C0A7E7B1A0D1}_is1" --silent --disable-interactivity --accept-source-agreements
          if ($LASTEXITCODE -ne 0) { throw "winget uninstall failed ($LASTEXITCODE)" }
